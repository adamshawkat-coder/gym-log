<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Gym Log</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #F3F4F6; color: #111827; overflow-x: hidden; }
        .drawer-open { transform: translateX(0); }
        .drawer-closed { transform: translateX(-100%); }
        .overlay-open { opacity: 1; pointer-events: auto; }
        .overlay-closed { opacity: 0; pointer-events: none; }
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        .tap-target { min-height: 44px; min-width: 44px; }
        
        /* Removes default arrows from the details summary tag */
        details > summary { list-style: none; }
        details > summary::-webkit-details-marker { display: none; }
    </style>
</head>
<body class="antialiased flex flex-col min-h-screen pb-32">

    <!-- APP BAR -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-40 px-4 py-3 flex justify-between items-center shadow-sm tap-target">
        <div class="flex items-center gap-3">
            <button onclick="toggleMenu()" aria-label="Open Menu" class="tap-target flex items-center justify-center text-gray-700 active:bg-gray-100 rounded-lg">
                <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"></path></svg>
            </button>
            <h1 id="header-title" class="text-xl font-bold tracking-tight text-gray-900">Dashboard</h1>
        </div>
        <div id="global-timer" class="hidden text-sm font-mono font-bold text-blue-600 bg-blue-50 px-3 py-1.5 rounded-lg border border-blue-100">
            00:00
        </div>
    </header>

    <!-- DRAWER MENU -->
    <div id="drawer-overlay" onclick="toggleMenu()" class="fixed inset-0 bg-black/50 z-50 transition-opacity duration-300 overlay-closed"></div>
    <div id="drawer-menu" class="fixed inset-y-0 left-0 w-72 bg-white shadow-2xl z-50 transition-transform duration-300 drawer-closed flex flex-col">
        <div class="p-5 border-b border-gray-100">
            <h2 class="text-2xl font-bold text-gray-900">Pro Gym Log</h2>
        </div>
        <nav class="flex-1 p-4 space-y-2 overflow-y-auto">
            <button onclick="navigate('dashboard')" class="w-full text-left tap-target px-4 rounded-xl font-semibold text-gray-700 active:bg-gray-100 flex items-center gap-3">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                Current Split
            </button>
            <button onclick="exportData()" class="w-full text-left tap-target px-4 rounded-xl font-semibold text-gray-700 active:bg-gray-100 flex items-center gap-3">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                Export JSON
            </button>
            <button onclick="resetData()" class="w-full text-left tap-target px-4 rounded-xl font-semibold text-red-600 active:bg-red-50 mt-4 flex items-center gap-3 border border-transparent active:border-red-100">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                Reset Database
            </button>
        </nav>
    </div>

    <!-- MAIN VIEWS -->
    <main class="flex-1 w-full max-w-2xl mx-auto">
        <div id="view-dashboard" class="p-4 space-y-4"></div>
        <div id="view-workout" class="hidden flex-col"></div>
    </main>

    <!-- FIXED FOOTER -->
    <footer id="persistent-footer" class="fixed bottom-0 left-0 w-full bg-white border-t border-gray-200 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] p-4 pb-safe hidden z-30">
        <div class="max-w-2xl mx-auto">
            <div id="rest-timer-module" class="hidden bg-gray-900 text-white rounded-2xl p-3 flex items-center justify-between mb-3 shadow-lg">
                <div class="flex items-center gap-4">
                    <span id="timer-display" class="text-3xl font-mono font-bold tracking-tight pl-2">00:00</span>
                    <span class="text-xs font-bold text-gray-400 uppercase tracking-widest">Resting</span>
                </div>
                <div class="flex gap-2">
                    <button onclick="addTime(30)" class="tap-target px-4 rounded-xl bg-gray-800 text-gray-200 font-bold text-sm active:bg-gray-700">+30s</button>
                    <button onclick="stopRestTimer()" class="tap-target px-4 rounded-xl bg-red-900/40 text-red-300 font-bold text-sm active:bg-red-900/60">Skip</button>
                </div>
            </div>
            <button onclick="finishWorkout()" class="w-full tap-target bg-blue-600 text-white font-bold text-lg rounded-2xl shadow-md active:bg-blue-700 active:scale-[0.98] transition-all">
                Finish Workout ✓
            </button>
        </div>
    </footer>

    <script>
        // --- DATABASE ---
        const workoutDatabase = [
            {
                title: "Day 1: Incline, Vertical Pull & Abs",
                exercises: [
                    { name: "Machine Incline Chest Press", target: "Upper Chest", sets: 3, reps: "8–12", rest: 120, note: "Align handles with upper chest. Pin shoulders back." },
                    { name: "Lat Pulldown Machine", target: "Lats", sets: 3, reps: "8–12", rest: 120, note: "Lean back slightly, pull elbows down to hip pockets." }
                ]
            },
            {
                title: "Day 2: Chest Isolation & Row",
                exercises: [
                    { name: "Machine Chest Fly (Pec Deck)", target: "Chest", sets: 3, reps: "10–15", rest: 120, note: "Slight bend in elbows. Squeeze at center." },
                    { name: "Machine Seated Row", target: "Mid Back", sets: 3, reps: "8–12", rest: 120, note: "Chest against pad. Squeeze shoulder blades." }
                ]
            }
        ];

        // --- STATE ---
        let appState = { history: [], activeSession: null };
        let audioCtx = null;
        let restTimerInterval = null, restTimeLeft = 0;
        let globalTimerInterval = null;

        // --- BOOTSTRAP ---
        function initApp() {
            try {
                appState.history = JSON.parse(localStorage.getItem('gym_history')) || [];
                appState.activeSession = JSON.parse(localStorage.getItem('gym_active')) || null;
            } catch (e) { console.error("Storage corrupt"); }
            
            appState.activeSession ? renderActiveWorkout() : renderDashboard();
        }

        function unlockAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playBeep() {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.frequency.value = 880; gain.gain.value = 0.1;
                osc.start(); osc.stop(audioCtx.currentTime + 0.5);
                if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
            } catch(e) {}
        }

        // --- UI ROUTING ---
        function toggleMenu() {
            unlockAudio();
            document.getElementById('drawer-menu').classList.toggle('drawer-open');
            document.getElementById('drawer-menu').classList.toggle('drawer-closed');
            document.getElementById('drawer-overlay').classList.toggle('overlay-open');
            document.getElementById('drawer-overlay').classList.toggle('overlay-closed');
        }

        function navigate(view) {
            toggleMenu();
            if (view === 'dashboard') {
                if (appState.activeSession && !confirm("Abandon current workout?")) return;
                appState.activeSession = null;
                saveState(); stopGlobalTimer(); stopRestTimer(); renderDashboard();
            }
        }

        // --- VIEWS ---
        function renderDashboard() {
            document.getElementById('view-workout').classList.add('hidden');
            document.getElementById('persistent-footer').classList.add('hidden');
            document.getElementById('global-timer').classList.add('hidden');
            document.getElementById('header-title').textContent = "Dashboard";
            
            const dash = document.getElementById('view-dashboard');
            dash.classList.remove('hidden');
            dash.innerHTML = workoutDatabase.map((day, idx) => `
                <div onclick="startWorkout(${idx})" class="tap-target bg-white p-5 rounded-2xl border border-gray-200 shadow-sm active:scale-[0.98] cursor-pointer flex justify-between items-center">
                    <div><h2 class="text-lg font-extrabold">${day.title}</h2><p class="text-sm text-gray-500">${day.exercises.length} Exercises</p></div>
                    <div class="h-10 w-10 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center">▶</div>
                </div>
            `).join('');
        }

        function startWorkout(idx) {
            unlockAudio();
            const tpl = workoutDatabase[idx];
            appState.activeSession = {
                startTime: Date.now(), title: tpl.title,
                exercises: tpl.exercises.map(ex => ({
                    ...ex, setsData: Array.from({length: ex.sets}, () => ({ isWarmup: false, weight: '', reps: '', rpe: '', done: false }))
                }))
            };
            saveState(); renderActiveWorkout();
        }

        function getHistory(exName, setIdx) {
            for (let i = appState.history.length - 1; i >= 0; i--) {
                const ex = appState.history[i].exercises.find(e => e.name === exName);
                if (ex && ex.setsData[setIdx] && ex.setsData[setIdx].done) return ex.setsData[setIdx];
            }
            return null;
        }

        function renderActiveWorkout() {
            document.getElementById('view-dashboard').classList.add('hidden');
            document.getElementById('persistent-footer').classList.remove('hidden');
            document.getElementById('header-title').textContent = appState.activeSession.title;
            startGlobalTimer();

            const container = document.getElementById('view-workout');
            container.classList.remove('hidden'); container.classList.add('flex');
            
            container.innerHTML = appState.activeSession.exercises.map((ex, exIdx) => `
                <div class="bg-white border-b border-gray-200 p-4 mb-4">
                    <span class="text-xs font-bold text-blue-600 uppercase">${ex.target}</span>
                    <h2 class="text-xl font-black mb-3">${ex.name}</h2>
                    
                    <details class="text-sm text-gray-600 bg-gray-50 p-3 rounded-lg border border-gray-100 mb-4 group cursor-pointer">
                        <summary class="font-medium flex justify-between items-center outline-none">
                            <span>💡 Form Pointers</span>
                            <span class="text-gray-400 group-open:rotate-180 transition-transform">▼</span>
                        </summary>
                        <div class="mt-2 pt-2 border-t border-gray-200">${ex.note}</div>
                    </details>

                    <div class="grid grid-cols-[3rem_1fr_1fr_3.5rem_3.5rem] gap-2 items-center text-xs font-bold text-gray-400 uppercase mb-2 text-center">
                        <div>Set</div><div>kg</div><div>Reps</div><div>RPE</div><div>Done</div>
                    </div>
                    
                    <div class="space-y-3">
                        ${ex.setsData.map((set, setIdx) => {
                            const hist = getHistory(ex.name, setIdx);
                            const setBg = set.isWarmup ? 'bg-orange-100 text-orange-700' : 'bg-gray-100 text-gray-700';
                            const doneBg = set.done ? 'bg-blue-600 text-white opacity-50' : 'bg-gray-200 text-gray-400';
                            
                            return `
                            <div id="row-${exIdx}-${setIdx}" class="grid grid-cols-[3rem_1fr_1fr_3.5rem_3.5rem] gap-2 items-start transition-opacity">
                                <button onclick="toggleWarmup(${exIdx}, ${setIdx})" class="w-12 h-12 rounded-xl font-extrabold ${setBg}">${set.isWarmup ? 'W' : setIdx + 1}</button>
                                
                                <div class="flex flex-col gap-1">
                                    <input type="number" inputmode="decimal" value="${set.weight}" oninput="handleInput(${exIdx}, ${setIdx}, 'weight', this.value)" class="h-12 bg-gray-50 border rounded-xl text-center font-bold text-base focus:ring-2 focus:ring-blue-500">
                                    <span class="text-[11px] text-gray-400 font-medium text-center truncate">${hist ? `Prev: ${hist.weight}` : '-'}</span>
                                </div>

                                <div class="flex flex-col gap-1">
                                    <input type="number" inputmode="numeric" value="${set.reps}" oninput="handleInput(${exIdx}, ${setIdx}, 'reps', this.value)" class="h-12 bg-gray-50 border rounded-xl text-center font-bold text-base focus:ring-2 focus:ring-blue-500">
                                    <span class="text-[11px] text-gray-400 font-medium text-center truncate">${hist ? `Prev: ${hist.reps}` : `Goal: ${ex.reps}`}</span>
                                </div>

                                <input type="number" inputmode="numeric" placeholder="1-10" value="${set.rpe || ''}" oninput="handleInput(${exIdx}, ${setIdx}, 'rpe', this.value)" class="h-12 bg-gray-50 border rounded-xl text-center font-bold text-sm focus:ring-2 focus:ring-blue-500">

                                <button onclick="toggleSet(${exIdx}, ${setIdx})" class="w-14 h-12 rounded-xl flex items-center justify-center ${doneBg} border border-transparent">
                                    <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"></path></svg>
                                </button>
                            </div>`
                        }).join('')}
                        
                        <button onclick="addSet(${exIdx})" class="w-full tap-target rounded-xl border-2 border-dashed border-gray-300 text-gray-500 font-bold text-sm active:bg-gray-50 mt-2">+ Add Set</button>
                    </div>
                </div>
            `).join('');
        }

        // --- DATA BINDING ---
        function handleInput(exIdx, setIdx, field, val) {
            appState.activeSession.exercises[exIdx].setsData[setIdx][field] = val;
            saveState();
        }

        function toggleWarmup(exIdx, setIdx) {
            unlockAudio();
            appState.activeSession.exercises[exIdx].setsData[setIdx].isWarmup = !appState.activeSession.exercises[exIdx].setsData[setIdx].isWarmup;
            saveState(); renderActiveWorkout();
        }

        function toggleSet(exIdx, setIdx) {
            unlockAudio();
            const set = appState.activeSession.exercises[exIdx].setsData[setIdx];
            set.done = !set.done;
            saveState();
            
            const btn = document.querySelector(`#row-${exIdx}-${setIdx} > button:last-child`);
            if (set.done) {
                btn.className = "w-14 h-12 rounded-xl flex items-center justify-center bg-blue-600 text-white opacity-50 border border-transparent";
                startRestTimer(appState.activeSession.exercises[exIdx].rest);
            } else {
                btn.className = "w-14 h-12 rounded-xl flex items-center justify-center bg-gray-200 text-gray-400 border border-transparent";
            }
        }

        function addSet(exIdx) {
            appState.activeSession.exercises[exIdx].setsData.push({ isWarmup: false, weight: '', reps: '', rpe: '', done: false });
            saveState(); renderActiveWorkout();
        }

        // --- TIMERS ---
        function startGlobalTimer() {
            const el = document.getElementById('global-timer'); el.classList.remove('hidden');
            clearInterval(globalTimerInterval);
            globalTimerInterval = setInterval(() => {
                if(!appState.activeSession) return;
                const secs = Math.floor((Date.now() - appState.activeSession.startTime) / 1000);
                el.textContent = `${Math.floor((secs % 3600) / 60).toString().padStart(2, '0')}:${(secs % 60).toString().padStart(2, '0')}`;
            }, 1000);
        }
        function stopGlobalTimer() { clearInterval(globalTimerInterval); document.getElementById('global-timer').classList.add('hidden'); }

        function startRestTimer(secs) {
            restTimeLeft = secs; document.getElementById('rest-timer-module').classList.remove('hidden'); updateRest();
            clearInterval(restTimerInterval);
            restTimerInterval = setInterval(() => {
                restTimeLeft--;
                if (restTimeLeft <= 0) { playBeep(); stopRestTimer(); } else { updateRest(); }
            }, 1000);
        }
        function updateRest() {
            document.getElementById('timer-display').textContent = `${Math.floor(restTimeLeft/60)}:${(restTimeLeft%60).toString().padStart(2,'0')}`;
        }
        function addTime(s) { unlockAudio(); restTimeLeft += s; updateRest(); }
        function stopRestTimer() { clearInterval(restTimerInterval); document.getElementById('rest-timer-module').classList.add('hidden'); }

        // --- STORAGE ---
        function saveState() {
            localStorage.setItem('gym_history', JSON.stringify(appState.history));
            localStorage.setItem('gym_active', JSON.stringify(appState.activeSession));
        }

        function finishWorkout() {
            unlockAudio();
            if(!confirm("Finish and save this workout?")) return;
            appState.activeSession.endTime = Date.now();
            appState.history.push(appState.activeSession);
            appState.activeSession = null;
            saveState(); stopGlobalTimer(); stopRestTimer(); renderDashboard();
        }

        function exportData() { navigator.clipboard.writeText(JSON.stringify(appState.history)); alert("Data copied to clipboard."); toggleMenu(); }
        function resetData() {
            if(!confirm("DELETE ALL HISTORY?")) return;
            localStorage.clear(); appState.history = []; appState.activeSession = null;
            stopGlobalTimer(); stopRestTimer(); toggleMenu(); renderDashboard();
        }

        initApp();
    </script>
</body>
</html>
            00:00
        </div>
    </header>

    <div id="drawer-overlay" onclick="toggleMenu()" class="fixed inset-0 bg-black/50 z-50 transition-opacity duration-300 overlay-closed"></div>
    <div id="drawer-menu" class="fixed inset-y-0 left-0 w-72 bg-white shadow-2xl z-50 transition-transform duration-300 drawer-closed flex flex-col">
        <div class="p-5 border-b border-gray-100">
            <h2 class="text-2xl font-bold text-gray-900">Pro Gym Log</h2>
            <p class="text-sm text-gray-500 mt-1">Local Storage Active</p>
        </div>
        <nav class="flex-1 p-4 space-y-2 overflow-y-auto">
            <button onclick="navigate('dashboard')" class="w-full text-left tap-target px-4 rounded-xl font-semibold text-gray-700 active:bg-gray-100 flex items-center gap-3">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                Current Split
            </button>
            <button onclick="exportData()" class="w-full text-left tap-target px-4 rounded-xl font-semibold text-gray-700 active:bg-gray-100 flex items-center gap-3">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                Export History (JSON)
            </button>
            <button onclick="resetData()" class="w-full text-left tap-target px-4 rounded-xl font-semibold text-red-600 active:bg-red-50 mt-4 flex items-center gap-3 border border-transparent active:border-red-100">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                Reset All Data
            </button>
        </nav>

    <main class="flex-1 w-full max-w-2xl mx-auto pb-32">
        
        <div id="view-dashboard" class="p-4 space-y-4">
            </div>

        <div id="view-workout" class="hidden flex-col">
            </div>

    </main>

        <div class="max-w-2xl mx-auto">
            
            <div id="rest-timer-module" class="hidden bg-gray-900 text-white rounded-2xl p-3 flex items-center justify-between mb-3 shadow-lg">
                <div class="flex items-center gap-4">
                    <span id="timer-display" class="text-3xl font-mono font-bold tracking-tight pl-2">00:00</span>

                </div>
            </div>

            <button id="btn-finish-workout" onclick="finishWorkout()" class="w-full tap-target bg-blue-600 text-white font-bold text-lg rounded-2xl shadow-md active:bg-blue-700 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
                Finish Workout ✓
            </button>
        </div>
    </footer>

    <script>
        // --- DATA STRUCTURES ---
        const workoutDatabase = [
            {
                title: "Day 1: Incline, Vertical Pull & Abs",
                exercises: [
                    { name: "Machine Incline Chest Press", target: "Upper Chest", defaultSets: 3, targetReps: "8–12", restSecs: 120, note: "Align handles with upper chest. Pin shoulders back." },
                    { name: "Lat Pulldown Machine", target: "Lats", defaultSets: 3, targetReps: "8–12", restSecs: 120, note: "Lean back slightly, pull elbows down to hip pockets." },
                    { name: "Cable Upright Row", target: "Lateral Delts", defaultSets: 3, targetReps: "10–15", restSecs: 90, note: "Pull high and wide, leading with elbows." },
                    { name: "Leg Press Machine", target: "Quads / Glutes", defaultSets: 3, targetReps: "8–12", restSecs: 120, note: "Feet shoulder-width. Don't lock knees at top." },
                    { name: "Cable Crunch (Rope)", target: "Abs", defaultSets: 3, targetReps: "10–15", restSecs: 90, note: "Curl ribcage down toward pelvis." }
                ]
            },
            {
                title: "Day 2: Chest Isolation, Row & Lower Abs",
                exercises: [
                    { name: "Machine Chest Fly (Pec Deck)", target: "Chest", defaultSets: 3, targetReps: "10–15", restSecs: 120, note: "Slight bend in elbows. Squeeze at center." },
                    { name: "Machine Seated Row", target: "Lats / Mid Back", defaultSets: 3, targetReps: "8–12", restSecs: 120, note: "Chest against pad. Squeeze shoulder blades." },
                    { name: "Cable Upright Row", target: "Lateral Delts", defaultSets: 3, targetReps: "10–15", restSecs: 90, note: "Control eccentric. Don't swing torso." },
                    { name: "Leg Extension Machine", target: "Quads", defaultSets: 3, targetReps: "10–15", restSecs: 90, note: "Align knee joint. Pause 1 sec at top." },
                    { name: "Lying Floor Leg Raise", target: "Lower Abs", defaultSets: 3, targetReps: "10–15", restSecs: 90, note: "Keep lower back flat to the floor." }
                ]
            }
        ];

        // --- STATE MANAGEMENT ---
        let appState = {
            history: [],       // Array of past completed workouts
            activeSession: null // Currently active workout data
        };

        let audioCtx = null;
        let restTimerInterval = null;
        let restTimeLeft = 0;
        
        let globalTimerInterval = null;
        let globalTimeElapsed = 0;

        // --- INITIALIZATION ---
        function initApp() {
            try {
                const savedHistory = localStorage.getItem('gym_pro_history');
                if (savedHistory) appState.history = JSON.parse(savedHistory);
                
                const savedSession = localStorage.getItem('gym_pro_active');
                if (savedSession) appState.activeSession = JSON.parse(savedSession);
            } catch (e) {
                console.error("Storage corrupted, starting fresh.", e);
            }

            if (appState.activeSession) {
                renderActiveWorkout();
            } else {
                renderDashboard();
            }
        }

        // --- AUDIO / UX BOOTSTRAP ---
        // Must be called on direct user interaction (clicks) to bypass mobile autoplay restrictions
        function unlockAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playBeep() {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.5);
                
                if ("vibrate" in navigator) navigator.vibrate([200, 100, 200]);
            } catch (e) { console.warn("Beep failed"); }
        }

        // --- NAVIGATION & MENUS ---
        function toggleMenu() {
            unlockAudio(); // Perfect place to silently unlock audio
            const drawer = document.getElementById('drawer-menu');
            const overlay = document.getElementById('drawer-overlay');
            
            if (drawer.classList.contains('drawer-closed')) {
                drawer.classList.remove('drawer-closed');
                drawer.classList.add('drawer-open');
                overlay.classList.remove('overlay-closed');
                overlay.classList.add('overlay-open');
            } else {
                drawer.classList.remove('drawer-open');
                drawer.classList.add('drawer-closed');
                overlay.classList.remove('overlay-open');
                overlay.classList.add('overlay-closed');
            }
        }

        function navigate(view) {
            toggleMenu();
            if (view === 'dashboard') {
                if (appState.activeSession) {
                    if(confirm("Abandon current workout?")) {
                        appState.activeSession = null;
                        saveState();
                        stopGlobalTimer();
                        stopRestTimer();
                        renderDashboard();
                    }
                } else {
                    renderDashboard();
                }
            }
        }

        // --- CORE LOGIC: DASHBOARD ---
        function renderDashboard() {
            document.getElementById('view-workout').classList.add('hidden');
            document.getElementById('persistent-footer').classList.add('hidden');
            document.getElementById('global-timer').classList.add('hidden');
            document.getElementById('header-title').textContent = "Dashboard";
            
            const dash = document.getElementById('view-dashboard');
            dash.classList.remove('hidden');

            dash.innerHTML = workoutDatabase.map((day, idx) => `
                <div onclick="startWorkout(${idx})" class="tap-target bg-white p-5 rounded-2xl border border-gray-200 shadow-sm active:scale-[0.98] transition-transform cursor-pointer flex justify-between items-center">
                    <div>
                        <h2 class="text-lg font-extrabold text-gray-900">${day.title}</h2>
                        <p class="text-sm font-medium text-gray-500 mt-1">${day.exercises.length} Exercises</p>
                    </div>
                    <div class="h-10 w-10 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"></path></svg>
                    </div>
                </div>
            `).join('');
        }

        // --- CORE LOGIC: ACTIVE WORKOUT ---
        function startWorkout(dayIndex) {
            unlockAudio();
            const template = workoutDatabase[dayIndex];
            
            // Generate active session structure
            appState.activeSession = {
                startTime: Date.now(),
                title: template.title,
                exercises: template.exercises.map(ex => {
                    let sets = [];
                    for(let i=0; i<ex.defaultSets; i++) {
                        sets.push({ isWarmup: false, weight: '', reps: '', done: false });
                    }
                    return {
                        name: ex.name,
                        target: ex.target,
                        restSecs: ex.restSecs,
                        note: ex.note,
                        targetReps: ex.targetReps,
                        sets: sets
                    };
                })
            };
            
            saveState();
            renderActiveWorkout();
        }

        function getHistoricalSet(exerciseName, setIndex) {
            // Search backwards through history for the last time this exercise was done
            for (let i = appState.history.length - 1; i >= 0; i--) {
                const session = appState.history[i];
                const ex = session.exercises.find(e => e.name === exerciseName);
                if (ex && ex.sets[setIndex] && ex.sets[setIndex].done) {
                    return ex.sets[setIndex];
                }
            }
            return null;
        }

        function renderActiveWorkout() {
            document.getElementById('view-dashboard').classList.add('hidden');
            document.getElementById('persistent-footer').classList.remove('hidden');
            
            document.getElementById('header-title').textContent = "Active Workout";
            
            startGlobalTimer();

            const container = document.getElementById('view-workout');
            container.classList.remove('hidden');
            container.classList.add('flex');

            let html = '';
            
            appState.activeSession.exercises.forEach((ex, exIdx) => {
                html += `
                <div class="bg-white border-b border-gray-200 p-4 mb-4">
                    <div class="mb-4">
                        <span class="text-xs font-bold text-blue-600 uppercase tracking-wide">${ex.target}</span>
                        <h2 class="text-xl font-black text-gray-900 leading-tight">${ex.name}</h2>
                        <p class="text-sm text-gray-500 mt-1 font-medium bg-gray-50 p-2 rounded-lg inline-block w-full border border-gray-100">💡 ${ex.note}</p>
                    </div>

                    <div class="flex items-center text-xs font-bold text-gray-400 uppercase mb-2 px-1">
                        <div class="w-12 text-center">Set</div>
                        <div class="flex-1 text-center">Weight</div>
                        <div class="flex-1 text-center">Reps</div>
                        <div class="w-14 text-center">Done</div>
                    </div>
                    
                    <div id="sets-container-${exIdx}" class="space-y-3">
                `;

                ex.sets.forEach((set, setIdx) => {
                    const hist = getHistoricalSet(ex.name, setIdx);
                    const histStr = hist ? `Last: ${hist.weight || 0}x${hist.reps || 0}` : `Target: ${ex.targetReps}`;
                    
                    // Button color states based on W (warmup) or Done
                    const setBg = set.isWarmup ? 'bg-orange-100 text-orange-700' : 'bg-gray-100 text-gray-700';
                    const setTxt = set.isWarmup ? 'W' : (setIdx + 1);
                    
                    const doneBg = set.done ? 'bg-blue-600 text-white' : 'bg-gray-200 text-gray-400';
                    const rowOpacity = set.done ? 'opacity-50' : 'opacity-100';

                    html += `
                        <div id="row-${exIdx}-${setIdx}" class="flex items-center gap-3 transition-opacity ${rowOpacity}">
                            <button onclick="toggleWarmup(${exIdx}, ${setIdx})" class="w-12 h-12 rounded-xl font-extrabold text-base flex-shrink-0 ${setBg} active:scale-95 transition-transform">
                                ${setTxt}
                            </button>
                            
                            <div class="flex-1 relative">
                                <input type="number" inputmode="decimal" placeholder="kg" value="${set.weight}" 
                                       oninput="handleInput(${exIdx}, ${setIdx}, 'weight', this.value)"
                                       class="w-full h-12 bg-gray-50 border border-gray-200 rounded-xl text-center font-bold text-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all">
                                <div class="absolute -bottom-4 left-0 w-full text-center text-[10px] font-semibold text-gray-400 pointer-events-none">${histStr}</div>
                            </div>

                            <div class="flex-1 relative">
                                <input type="number" inputmode="numeric" placeholder="reps" value="${set.reps}" 
                                       oninput="handleInput(${exIdx}, ${setIdx}, 'reps', this.value)"
                                       class="w-full h-12 bg-gray-50 border border-gray-200 rounded-xl text-center font-bold text-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all">
                            </div>

                            <button onclick="toggleSet(${exIdx}, ${setIdx})" class="w-14 h-14 rounded-xl flex items-center justify-center flex-shrink-0 ${doneBg} active:scale-95 shadow-sm transition-all border border-transparent">
                                <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>
                            </button>
                        </div>
                    `;
                });

                html += `
                        <button onclick="addSet(${exIdx})" class="w-full tap-target mt-4 rounded-xl border-2 border-dashed border-gray-300 text-gray-500 font-bold text-sm hover:bg-gray-50 active:bg-gray-100 transition-colors">
                            + Add Set
                        </button>
                    </div> </div> `;
            });

            container.innerHTML = html;
        }

        // --- DATA BINDING (Surgical updates to avoid re-rendering entire DOM on typing) ---
        
        function handleInput(exIdx, setIdx, field, val) {
            appState.activeSession.exercises[exIdx].sets[setIdx][field] = val;
            saveState(); // Saves seamlessly in background without breaking input focus
        }

        function toggleWarmup(exIdx, setIdx) {
            unlockAudio();
            const set = appState.activeSession.exercises[exIdx].sets[setIdx];
            set.isWarmup = !set.isWarmup;
            saveState();
            // Surgical re-render
            renderActiveWorkout(); 
        }

        function addSet(exIdx) {
            appState.activeSession.exercises[exIdx].sets.push({ isWarmup: false, weight: '', reps: '', done: false });
            saveState();
            renderActiveWorkout();
        }

        function toggleSet(exIdx, setIdx) {
            unlockAudio();
            const set = appState.activeSession.exercises[exIdx].sets[setIdx];
            set.done = !set.done;
            saveState();
            
            // Visual update without losing focus on other elements
            const row = document.getElementById(`row-${exIdx}-${setIdx}`);
            const btn = row.lastElementChild;
            
            if (set.done) {
                row.classList.add('opacity-50');
                btn.className = "w-14 h-14 rounded-xl flex items-center justify-center flex-shrink-0 bg-blue-600 text-white active:scale-95 shadow-sm transition-all border border-transparent";
                
                // Trigger Rest Timer
                const restSecs = appState.activeSession.exercises[exIdx].restSecs;
                startRestTimer(restSecs);
            } else {
                row.classList.remove('opacity-50');
                btn.className = "w-14 h-14 rounded-xl flex items-center justify-center flex-shrink-0 bg-gray-200 text-gray-400 active:scale-95 shadow-sm transition-all border border-transparent";
            }
        }

        // --- TIMERS ---
        function startGlobalTimer() {
            const timerEl = document.getElementById('global-timer');
            timerEl.classList.remove('hidden');
            
            clearInterval(globalTimerInterval);
            
            const updateGlobalTime = () => {
                if(!appState.activeSession) return;
                const diffMs = Date.now() - appState.activeSession.startTime;
                const totalSecs = Math.floor(diffMs / 1000);
                const hrs = Math.floor(totalSecs / 3600);
                const mins = Math.floor((totalSecs % 3600) / 60);
                const secs = totalSecs % 60;
                
                let timeStr = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
                if (hrs > 0) timeStr = `${hrs}:${timeStr}`;
                
                timerEl.textContent = timeStr;
            };
            
            updateGlobalTime();
            globalTimerInterval = setInterval(updateGlobalTime, 1000);
        }

        function stopGlobalTimer() {
            clearInterval(globalTimerInterval);
            document.getElementById('global-timer').classList.add('hidden');
        }

        function startRestTimer(seconds) {
            restTimeLeft = seconds;
            document.getElementById('rest-timer-module').classList.remove('hidden');
            updateRestDisplay();

            clearInterval(restTimerInterval);
            restTimerInterval = setInterval(() => {
                restTimeLeft--;
                if (restTimeLeft <= 0) {
                    playBeep();
                    stopRestTimer();
                } else {
                    updateRestDisplay();
                }
            }, 1000);
        }

        function updateRestDisplay() {
            const mins = Math.floor(restTimeLeft / 60);
            const secs = restTimeLeft % 60;
            document.getElementById('timer-display').textContent = `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        function addTime(secs) {
            unlockAudio();
            restTimeLeft += secs;
            updateRestDisplay();
        }

        function stopRestTimer() {
            clearInterval(restTimerInterval);
            document.getElementById('rest-timer-module').classList.add('hidden');
        }

        // --- WORKOUT COMPLETION & EXPORT ---
        function finishWorkout() {
            unlockAudio();
            if(confirm("Finish and log this workout?")) {
                // Save to history
                appState.activeSession.endTime = Date.now();
                appState.history.push(appState.activeSession);
                
                // Reset active session
                appState.activeSession = null;
                saveState();
                
                stopGlobalTimer();
                stopRestTimer();
                renderDashboard();
            }
        }

        function saveState() {
            localStorage.setItem('gym_pro_history', JSON.stringify(appState.history));
            localStorage.setItem('gym_pro_active', JSON.stringify(appState.activeSession));
        }

        function exportData() {
            const dataStr = JSON.stringify(appState.history, null, 2);
            navigator.clipboard.writeText(dataStr).then(() => {
                alert("History JSON copied to clipboard!");
            }).catch(err => {
                alert("Failed to copy. Check console.");
                console.error(err);
            });
            toggleMenu();
        }

        function resetData() {
            if(confirm("WARNING: This permanently deletes all your workout history. Proceed?")) {
                localStorage.removeItem('gym_pro_history');
                localStorage.removeItem('gym_pro_active');
                appState.history = [];
                appState.activeSession = null;
                stopGlobalTimer();
                stopRestTimer();
                toggleMenu();
                renderDashboard();
            }
        }

        // --- BOOTSTRAP ---
        initApp();

    </script>
</body>

                            <span class="text-xs font-medium text-stone-400">Day ${index + 1}</span>
                            <h2 class="text-lg font-bold text-[#22201E]">${day.title}</h2>
                            <p class="text-xs text-stone-500 mt-1">${day.exercises.length} Exercises</p>
                        </div>
                        <div class="w-8 h-8 rounded-full flex items-center justify-center ${isCompleted ? 'bg-[#606C38] text-white' : 'bg-stone-100 text-stone-600'}">
                            <span class="font-bold text-sm">${isCompleted ? '✓' : '→'}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function selectDay(index) {
            selectedDayIndex = index;
            currentCardIndex = 0;
            currentCompletedSets = 0;
            document.getElementById('view-home').classList.add('hidden');
            document.getElementById('view-flashcards').classList.remove('hidden');
            renderCard();
        }

        function showHome() {
            stopRestTimer();
            document.getElementById('view-flashcards').classList.add('hidden');
            document.getElementById('view-home').classList.remove('hidden');
            renderHome();
        }

        function getExerciseKey() {
            return `d${selectedDayIndex}_e${currentCardIndex}`;
        }

        function renderCard() {
            const day = workoutDays[selectedDayIndex];
            const ex = day.exercises[currentCardIndex];
            const exKey = getExerciseKey();

            // Load previously saved sets data or initialize empty
            if (!loggedLogs[exKey]) {
                loggedLogs[exKey] = [
                    { weight: '', reps: '' },
                    { weight: '', reps: '' },
                    { weight: '', reps: '' }
                ];
            }

            document.getElementById('card-counter').textContent = `${currentCardIndex + 1} / ${day.exercises.length}`;
            document.getElementById('ex-image').src = ex.image;
            document.getElementById('ex-target').textContent = ex.target;
            document.getElementById('ex-name').textContent = ex.name;
            document.getElementById('ex-form').textContent = ex.formNote;

            // Render 3 Set Rows
            const rowsContainer = document.getElementById('set-rows-container');
            rowsContainer.innerHTML = [0, 1, 2].map(sIdx => {
                const isSetDone = sIdx < currentCompletedSets;
                const setVal = loggedLogs[exKey][sIdx] || { weight: '', reps: '' };
                
                return `
                    <div class="flex items-center justify-between gap-2 bg-white p-2 rounded-xl border border-stone-200 text-xs">
                        <span class="font-bold text-stone-500 w-4 text-center">${sIdx + 1}</span>
                        <span class="text-stone-400 font-medium">${ex.reps}</span>
                        <input type="number" placeholder="lbs" value="${setVal.weight}" onchange="saveInputData(${sIdx}, 'weight', this.value)"
                               class="w-14 p-1 rounded-lg bg-stone-100 text-center font-bold focus:outline-none focus:ring-1 focus:ring-[#606C38]">
                        <input type="number" placeholder="reps" value="${setVal.reps}" onchange="saveInputData(${sIdx}, 'reps', this.value)"
                               class="w-14 p-1 rounded-lg bg-stone-100 text-center font-bold focus:outline-none focus:ring-1 focus:ring-[#606C38]">
                        <button onclick="toggleSetStatus(${sIdx})" class="w-6 h-6 rounded-full flex items-center justify-center ${isSetDone ? 'bg-[#606C38] text-white' : 'bg-stone-200 text-stone-400'}">
                            <span class="text-xs font-bold">${isSetDone ? '✓' : ''}</span>
                        </button>
                    </div>
                `;
            }).join('');

            document.getElementById('btn-prev').disabled = currentCardIndex === 0;
            updateActionButtonState();
        }

        function saveInputData(setIdx, field, val) {
            const exKey = getExerciseKey();
            loggedLogs[exKey][setIdx][field] = val;
            localStorage.setItem('gym_logged_data', JSON.stringify(loggedLogs));
        }

        function toggleSetStatus(setIdx) {
            if (setIdx < currentCompletedSets) {
                currentCompletedSets = setIdx;
            } else {
                currentCompletedSets = setIdx + 1;
            }
            renderCard();
        }

        function updateActionButtonState() {
            const btnText = document.getElementById('btn-action-text');
            if (currentCompletedSets < 3) {
                btnText.textContent = `Complete Set ${currentCompletedSets + 1}`;
            } else {
                const isLastEx = currentCardIndex === workoutDays[selectedDayIndex].exercises.length - 1;
                btnText.textContent = isLastEx ? 'Finish Workout ✓' : 'Next Exercise →';
            }
        }

        function handlePrimaryAction() {
            const ex = workoutDays[selectedDayIndex].exercises[currentCardIndex];

            if (currentCompletedSets < 3) {
                currentCompletedSets++;
                renderCard();

                // Trigger Rest Timer for Set 1 & Set 2 completions
                if (currentCompletedSets < 3) {
                    startRestTimer(ex.restSeconds, ex.rest);
                }
            } else {
                // Advance to next exercise after Set 3 completion
                stopRestTimer();
                currentCompletedSets = 0;
                nextCard();
            }
        }

        function nextCard() {
            const day = workoutDays[selectedDayIndex];
            if (currentCardIndex < day.exercises.length - 1) {
                currentCardIndex++;
                currentCompletedSets = 0;
                renderCard();
            } else {
                completedDays[selectedDayIndex] = true;
                localStorage.setItem('gym_completed_days', JSON.stringify(completedDays));
                showHome();
            }
        }

        function prevCard() {
            if (currentCardIndex > 0) {
                stopRestTimer();
                currentCardIndex--;
                currentCompletedSets = 0;
                renderCard();
            }
        }

        /* INLINE CIRCULAR TIMER LOGIC */
        function startRestTimer(seconds, targetText) {
            totalTimerSeconds = seconds;
            timeLeft = seconds;
            document.getElementById('timer-target-text').textContent = targetText;
            document.getElementById('inline-timer-bar').classList.remove('hidden');
            
            timerRunning = true;
            updateTimerDisplay();

            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (timerRunning && timeLeft > 0) {
                    timeLeft--;
                    updateTimerDisplay();
                } else if (timeLeft === 0) {
                    triggerAlertSignal();
                    stopRestTimer();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const mins = Math.floor(timeLeft / 60);
            const secs = timeLeft % 60;
            document.getElementById('timer-display').textContent = `${mins}:${secs < 10 ? '0' : ''}${secs}`;

            // Update SVG Ring stroke dash offset
            const circle = document.getElementById('timer-ring-path');
            const circumference = 100; // r=16 mapped stroke
            const offset = circumference - (timeLeft / totalTimerSeconds) * circumference;
            circle.style.strokeDashoffset = offset;
        }

        function toggleTimer() {
            timerRunning = !timerRunning;
            document.getElementById('btn-toggle-timer').textContent = timerRunning ? 'Pause' : 'Resume';
        }

        function addTime(secs) {
            timeLeft += secs;
            totalTimerSeconds += secs;
            updateTimerDisplay();
        }

        function stopRestTimer() {
            clearInterval(timerInterval);
            timerRunning = false;
            document.getElementById('inline-timer-bar').classList.add('hidden');
        }

        /* SOUND & VIBRATION ALERTS */
        function triggerAlertSignal() {
            // Haptic Vibration (Android)
            if ("vibrate" in navigator) {
                navigator.vibrate([200, 100, 200, 100, 400]);
            }

            // Web Audio Beep Tone
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, audioCtx.currentTime); // A5 tone
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.6);
            } catch (e) {
                console.log("Audio alert blocked by browser context.");
            }
        }

        function resetData() {
            if (confirm("Reset all workout completion and logged set progress?")) {
                completedDays = {};
                loggedLogs = {};
                localStorage.removeItem('gym_completed_days');
                localStorage.removeItem('gym_logged_data');
                renderHome();
            }
        }

        // Offline Service Worker Registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                const swCode = `
                    self.addEventListener('install', e => e.waitUntil(caches.open('gym-v1').then(c => c.addAll(['/']))));
                    self.addEventListener('fetch', e => e.respondWith(caches.match(e.request).then(r => r || fetch(e.request))));
                `;
                const blob = new Blob([swCode], { type: 'application/javascript' });
                navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
            });
        }

        // Initial Load
        renderHome();
    </script>
</body>

        </div>

        <!-- REST TIMER OVERLAY -->
        <div id="timer-overlay" class="hidden fixed inset-0 bg-[#22201E]/90 backdrop-blur-md z-50 flex flex-col items-center justify-center p-6 text-white">
            <span class="text-xs font-semibold tracking-widest text-[#606C38] uppercase mb-2">Rest Period</span>
            <div id="timer-display" class="text-6xl font-bold font-mono tracking-tight my-4">00:00</div>
            <p id="timer-target" class="text-xs text-stone-400 mb-8 text-center"></p>

            <div class="flex items-center gap-4 w-full max-w-xs">
                <button onclick="addTime(30)" class="flex-1 py-3 rounded-xl bg-stone-800 text-stone-200 font-medium text-sm">
                    +30s

                    Pause
                </button>
                <button onclick="skipTimer()" class="flex-1 py-3 rounded-xl bg-stone-800 text-stone-200 font-medium text-sm">

        const workoutDays = [

                exercises: [

                    { name: "Cable Woodchopper (Rope)", target: "Obliques / Core", sets: 3, reps: "10–15", rest: "90s", restSeconds: 90, formNote: "Rotate from mid-spine and hips, keeping core tight.", image: "https://images.unsplash.com/photo-1518611012118-696072aa579a?auto=format&fit=crop&w=600&q=80" }
                ]
            }
        ];

        let selectedDayIndex = 0;
        let currentCardIndex = 0;
        let completedDays = JSON.parse(localStorage.getItem('gym_completed_days')) || {};
        let timeLeft = 0;
        let timerRunning = false;
        let timerInterval = null;

        function renderHome() {
            const container = document.getElementById('view-home');
            container.innerHTML = workoutDays.map((day, index) => {
                const isCompleted = !!completedDays[index];
                return `
                    <div onclick="selectDay(${index})" class="p-5 rounded-2xl bg-white border border-stone-200 shadow-sm active:scale-95 transition-all cursor-pointer flex justify-between items-center">
                        <div>
                            <span class="text-xs font-medium text-stone-400">Day ${index + 1}</span>
                            <h2 class="text-lg font-bold text-[#22201E]">${day.title}</h2>
                            <p class="text-xs text-stone-500 mt-1">${day.exercises.length} Exercises</p>
                        </div>
                        <div class="w-8 h-8 rounded-full flex items-center justify-center ${isCompleted ? 'bg-[#606C38] text-white' : 'bg-stone-100 text-stone-600'}">
                            <span class="font-bold text-sm">${isCompleted ? '✓' : '→'}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function selectDay(index) {
            selectedDayIndex = index;
            currentCardIndex = 0;
            document.getElementById('view-home').classList.add('hidden');
            document.getElementById('view-flashcards').classList.remove('hidden');
            renderCard();
        }

        function showHome() {
            document.getElementById('view-flashcards').classList.add('hidden');
            document.getElementById('view-home').classList.remove('hidden');
            renderHome();
        }

        function renderCard() {
            const day = workoutDays[selectedDayIndex];
            const ex = day.exercises[currentCardIndex];

            document.getElementById('card-counter').textContent = `${currentCardIndex + 1} / ${day.exercises.length}`;
            document.getElementById('ex-image').src = ex.image;
            document.getElementById('ex-target').textContent = ex.target;
            document.getElementById('ex-name').textContent = ex.name;
            document.getElementById('ex-sets').textContent = ex.sets;
            document.getElementById('ex-reps').textContent = ex.reps;
            document.getElementById('ex-rest').textContent = ex.rest;
            document.getElementById('ex-form').textContent = ex.formNote;

            document.getElementById('btn-prev').disabled = currentCardIndex === 0;
            
            const isLast = currentCardIndex === day.exercises.length - 1;
            document.getElementById('btn-next-text').textContent = isLast ? 'Finish Workout ✓' : 'Rest & Next';
            document.getElementById('btn-next-rest').textContent = isLast ? '' : `⏱ ${ex.rest}`;
        }

        function nextCard() {
            const day = workoutDays[selectedDayIndex];
            if (currentCardIndex < day.exercises.length - 1) {
                currentCardIndex++;
                renderCard();
            } else {
                completedDays[selectedDayIndex] = true;
                localStorage.setItem('gym_completed_days', JSON.stringify(completedDays));
                showHome();
            }
        }

        function prevCard() {
            if (currentCardIndex > 0) {
                currentCardIndex--;
                renderCard();
            }
        }

        function startRestTimer() {
            const isLast = currentCardIndex === workoutDays[selectedDayIndex].exercises.length - 1;
            if (isLast) {
                nextCard();
                return;
            }

            const ex = workoutDays[selectedDayIndex].exercises[currentCardIndex];
            timeLeft = ex.restSeconds;
            document.getElementById('timer-target').textContent = `Target: ${ex.rest}`;
            document.getElementById('timer-overlay').classList.remove('hidden');
            
            timerRunning = true;
            updateTimerDisplay();

            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (timerRunning && timeLeft > 0) {
                    timeLeft--;
                    updateTimerDisplay();
                } else if (timeLeft === 0) {
                    skipTimer();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const mins = Math.floor(timeLeft / 60);
            const secs = timeLeft % 60;
            document.getElementById('timer-display').textContent = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        function toggleTimer() {
            timerRunning = !timerRunning;
            document.getElementById('btn-toggle-timer').textContent = timerRunning ? 'Pause' : 'Resume';
        }

        function addTime(secs) {
            timeLeft += secs;
            updateTimerDisplay();
        }

        function skipTimer() {
            clearInterval(timerInterval);
            document.getElementById('timer-overlay').classList.add('hidden');
            nextCard();
        }

        function resetData() {
            if (confirm("Reset all completion progress?")) {
                completedDays = {};
                localStorage.removeItem('gym_completed_days');
                renderHome();
            }
        }

        // Initial Load
        renderHome();
    </script>
