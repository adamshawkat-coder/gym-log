<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sleek Gym Log</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #F9F8F6; color: #22201E; }
        .hidden { display: none !important; }
    </style>
</head>
<body class="antialiased flex flex-col min-h-screen">

    <header class="px-6 pt-8 pb-4 flex justify-between items-center max-w-md mx-auto w-full">
        <div>
            <span class="text-xs font-semibold tracking-wider text-[#606C38] uppercase">Personal Log</span>
            <h1 class="text-2xl font-bold tracking-tight">Daily Split</h1>
        </div>
        <button onclick="resetData()" class="text-xs text-stone-400 hover:text-stone-700 underline">Reset Progress</button>
    </header>

    <main class="flex-1 px-6 max-w-md mx-auto w-full pb-12 relative">

        <!-- HOME VIEW -->
        <div id="view-home" class="space-y-4 mt-2">
            <!-- Rendered via JS -->
        </div>

        <!-- FLASHCARDS VIEW -->
        <div id="view-flashcards" class="hidden flex flex-col h-full">
            <div class="flex justify-between items-center mb-4">
                <button onclick="showHome()" class="text-sm font-semibold text-stone-600 flex items-center gap-1">
                    ← Back to Split
                </button>
                <span id="card-counter" class="text-xs font-bold px-2.5 py-1 rounded-full bg-stone-200 text-stone-700"></span>
            </div>

            <div class="bg-white rounded-3xl border border-stone-200 shadow-sm overflow-hidden flex flex-col flex-1">
                <div class="h-56 bg-stone-100 relative overflow-hidden">
                    <img id="ex-image" src="" alt="" class="w-full h-full object-cover">
                    <div id="ex-target" class="absolute top-3 left-3 bg-black/60 backdrop-blur-md text-white text-xs px-3 py-1 rounded-full font-medium"></div>
                </div>

                <div class="p-6 flex flex-col justify-between flex-1">
                    <div>
                        <h2 id="ex-name" class="text-xl font-bold text-[#22201E]"></h2>
                        
                        <div class="grid grid-cols-3 gap-2 my-4">
                            <div class="bg-[#F9F8F6] p-2.5 rounded-xl text-center border border-stone-100">
                                <span class="block text-[10px] text-stone-400 uppercase font-semibold">Sets</span>
                                <span id="ex-sets" class="text-sm font-bold text-[#22201E]"></span>
                            </div>
                            <div class="bg-[#F9F8F6] p-2.5 rounded-xl text-center border border-stone-100">
                                <span class="block text-[10px] text-stone-400 uppercase font-semibold">Reps</span>
                                <span id="ex-reps" class="text-sm font-bold text-[#22201E]"></span>
                            </div>
                            <div class="bg-[#F9F8F6] p-2.5 rounded-xl text-center border border-stone-100">
                                <span class="block text-[10px] text-stone-400 uppercase font-semibold">Rest Target</span>
                                <span id="ex-rest" class="text-sm font-bold text-[#606C38]"></span>
                            </div>
                        </div>

                        <div class="bg-stone-50 p-4 rounded-2xl border border-stone-100">
                            <span class="text-xs font-bold text-[#606C38] uppercase tracking-wider block mb-1">Form Pointers</span>
                            <p id="ex-form" class="text-xs text-stone-600 leading-relaxed"></p>
                        </div>
                    </div>

                    <div class="flex gap-3 mt-6">
                        <button id="btn-prev" onclick="prevCard()" class="flex-1 py-3.5 rounded-xl border border-stone-200 text-stone-700 font-semibold text-sm disabled:opacity-30">
                            Prev
                        </button>
                        <button id="btn-next" onclick="startRestTimer()" class="flex-1 py-3.5 rounded-xl bg-[#22201E] text-white font-semibold text-sm shadow-sm active:scale-95 transition-all flex items-center justify-center gap-2">
                            <span id="btn-next-text">Rest & Next</span>
                            <span id="btn-next-rest" class="text-xs bg-stone-700 text-stone-200 px-2 py-0.5 rounded-md"></span>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- REST TIMER OVERLAY -->
        <div id="timer-overlay" class="hidden fixed inset-0 bg-[#22201E]/90 backdrop-blur-md z-50 flex flex-col items-center justify-center p-6 text-white">
            <span class="text-xs font-semibold tracking-widest text-[#606C38] uppercase mb-2">Rest Period</span>
            <div id="timer-display" class="text-6xl font-bold font-mono tracking-tight my-4">00:00</div>
            <p id="timer-target" class="text-xs text-stone-400 mb-8 text-center"></p>

            <div class="flex items-center gap-4 w-full max-w-xs">
                <button onclick="addTime(30)" class="flex-1 py-3 rounded-xl bg-stone-800 text-stone-200 font-medium text-sm">
                    +30s
                </button>
                <button id="btn-toggle-timer" onclick="toggleTimer()" class="flex-1 py-3 rounded-xl bg-[#606C38] text-white font-semibold text-sm">
                    Pause
                </button>
                <button onclick="skipTimer()" class="flex-1 py-3 rounded-xl bg-stone-800 text-stone-200 font-medium text-sm">
                    Skip
                </button>
            </div>
        </div>

    </main>

    <script>
        const workoutDays = [
            {
                title: "Day 1: Incline, Vertical Pull & Abs",
                exercises: [
                    { name: "Machine Incline Chest Press", target: "Upper Chest", sets: 3, reps: "8–12", rest: "2 min", restSeconds: 120, formNote: "Set seat height so handles align with upper chest. Keep shoulders pinned back.", image: "https://images.unsplash.com/photo-1571019613454-1cb2f99b2d8b?auto=format&fit=crop&w=600&q=80" },
                    { name: "Lat Pulldown Machine", target: "Lats", sets: 3, reps: "8–12", rest: "2 min", restSeconds: 120, formNote: "Lean back slightly, pull elbows down and back toward your hip pockets.", image: "https://images.unsplash.com/photo-1584735935682-2f2b69dff9d2?auto=format&fit=crop&w=600&q=80" },
                    { name: "Cable Upright Row", target: "Lateral Delts", sets: 3, reps: "10–15", rest: "90s", restSeconds: 90, formNote: "Pull high and wide, leading with elbows. Stop hands around chest level.", image: "https://images.unsplash.com/photo-1534438327276-14e5300c3a48?auto=format&fit=crop&w=600&q=80" },
                    { name: "Leg Press Machine", target: "Quads / Glutes", sets: 3, reps: "8–12", rest: "2 min", restSeconds: 120, formNote: "Place feet shoulder-width flat on platform. Don't lock knees at top.", image: "https://images.unsplash.com/photo-1517838277536-f5f99be501cd?auto=format&fit=crop&w=600&q=80" },
                    { name: "Cable Crunch (Rope)", target: "Upper Abdominals", sets: 3, reps: "10–15", rest: "90s", restSeconds: 90, formNote: "Kneel facing stack, curl ribcage down toward pelvis using abs.", image: "https://images.unsplash.com/photo-1571019614242-c5c5dee9f50b?auto=format&fit=crop&w=600&q=80" }
                ]
            },
            {
                title: "Day 2: Chest Isolation, Row & Lower Abs",
                exercises: [
                    { name: "Machine Chest Fly (Pec Deck)", target: "Chest", sets: 3, reps: "10–15", rest: "2 min", restSeconds: 120, formNote: "Keep a slight bend in elbows. Squeeze biceps together at center.", image: "https://images.unsplash.com/photo-1583454110551-21f2fa2afe61?auto=format&fit=crop&w=600&q=80" },
                    { name: "Machine Seated Row", target: "Lats / Mid Back", sets: 3, reps: "8–12", rest: "2 min", restSeconds: 120, formNote: "Keep chest pressed against pad. Pull straight back, squeezing shoulder blades.", image: "https://images.unsplash.com/photo-1541534741688-6078c6bfb5c5?auto=format&fit=crop&w=600&q=80" },
                    { name: "Cable Upright Row", target: "Lateral Delts", sets: 3, reps: "10–15", rest: "90s", restSeconds: 90, formNote: "Control the eccentric phase on the way down. Don't swing torso.", image: "https://images.unsplash.com/photo-1534438327276-14e5300c3a48?auto=format&fit=crop&w=600&q=80" },
                    { name: "Leg Extension Machine", target: "Quads", sets: 3, reps: "10–15", rest: "90s", restSeconds: 90, formNote: "Align knee joint with machine pivot. Pause for 1 sec at top.", image: "https://images.unsplash.com/photo-1517838277536-f5f99be501cd?auto=format&fit=crop&w=600&q=80" },
                    { name: "Lying Floor Leg Raise", target: "Lower Abdominals", sets: 3, reps: "10–15", rest: "90s", restSeconds: 90, formNote: "Keep lower back flat to the floor throughout.", image: "https://images.unsplash.com/photo-1566241142559-40e1dab266c6?auto=format&fit=crop&w=600&q=80" }
                ]
            },
            {
                title: "Day 3: Incline, Width & Obliques",
                exercises: [
                    { name: "Machine Incline Chest Press", target: "Upper Chest", sets: 3, reps: "8–12", rest: "2 min", restSeconds: 120, formNote: "Control weight down for a 2-second stretch before exploding up.", image: "https://images.unsplash.com/photo-1571019613454-1cb2f99b2d8b?auto=format&fit=crop&w=600&q=80" },
                    { name: "Lat Pulldown Machine", target: "Lats", sets: 3, reps: "8–12", rest: "2 min", restSeconds: 120, formNote: "Keep a proud chest. Don't let shoulders roll forward at top.", image: "https://images.unsplash.com/photo-1584735935682-2f2b69dff9d2?auto=format&fit=crop&w=600&q=80" },
                    { name: "Seated Leg Curl Machine", target: "Hamstrings", sets: 3, reps: "10–15", rest: "90s", restSeconds: 90, formNote: "Keep pad locked against lower calves. Don't let hips lift.", image: "https://images.unsplash.com/photo-1574680096145-d05b474e2155?auto=format&fit=crop&w=600&q=80" },
                    { name: "Machine Chest Fly (Pec Deck)", target: "Chest", sets: 3, reps: "10–15", rest: "2 min", restSeconds: 120, formNote: "Focus on deep stretch in chest, avoid hyperextending shoulders.", image: "https://images.unsplash.com/photo-1583454110551-21f2fa2afe61?auto=format&fit=crop&w=600&q=80" },
                    { name: "Cable Woodchopper (Rope)", target: "Obliques / Core", sets: 3, reps: "10–15", rest: "90s", restSeconds: 90, formNote: "Rotate from mid-spine and hips, keeping core tight.", image: "https://images.unsplash.com/photo-1518611012118-696072aa579a?auto=format&fit=crop&w=600&q=80" }
                ]
            }
        ];

        let selectedDayIndex = 0;
        let currentCardIndex = 0;
        let completedDays = JSON.parse(localStorage.getItem('gym_completed_days')) || {};
        let timeLeft = 0;
        let timerRunning = false;
        let timerInterval = null;

        function renderHome() {
            const container = document.getElementById('view-home');
            container.innerHTML = workoutDays.map((day, index) => {
                const isCompleted = !!completedDays[index];
                return `
                    <div onclick="selectDay(${index})" class="p-5 rounded-2xl bg-white border border-stone-200 shadow-sm active:scale-95 transition-all cursor-pointer flex justify-between items-center">
                        <div>
                            <span class="text-xs font-medium text-stone-400">Day ${index + 1}</span>
                            <h2 class="text-lg font-bold text-[#22201E]">${day.title}</h2>
                            <p class="text-xs text-stone-500 mt-1">${day.exercises.length} Exercises</p>
                        </div>
                        <div class="w-8 h-8 rounded-full flex items-center justify-center ${isCompleted ? 'bg-[#606C38] text-white' : 'bg-stone-100 text-stone-600'}">
                            <span class="font-bold text-sm">${isCompleted ? '✓' : '→'}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function selectDay(index) {
            selectedDayIndex = index;
            currentCardIndex = 0;
            document.getElementById('view-home').classList.add('hidden');
            document.getElementById('view-flashcards').classList.remove('hidden');
            renderCard();
        }

        function showHome() {
            document.getElementById('view-flashcards').classList.add('hidden');
            document.getElementById('view-home').classList.remove('hidden');
            renderHome();
        }

        function renderCard() {
            const day = workoutDays[selectedDayIndex];
            const ex = day.exercises[currentCardIndex];

            document.getElementById('card-counter').textContent = `${currentCardIndex + 1} / ${day.exercises.length}`;
            document.getElementById('ex-image').src = ex.image;
            document.getElementById('ex-target').textContent = ex.target;
            document.getElementById('ex-name').textContent = ex.name;
            document.getElementById('ex-sets').textContent = ex.sets;
            document.getElementById('ex-reps').textContent = ex.reps;
            document.getElementById('ex-rest').textContent = ex.rest;
            document.getElementById('ex-form').textContent = ex.formNote;

            document.getElementById('btn-prev').disabled = currentCardIndex === 0;
            
            const isLast = currentCardIndex === day.exercises.length - 1;
            document.getElementById('btn-next-text').textContent = isLast ? 'Finish Workout ✓' : 'Rest & Next';
            document.getElementById('btn-next-rest').textContent = isLast ? '' : `⏱ ${ex.rest}`;
        }

        function nextCard() {
            const day = workoutDays[selectedDayIndex];
            if (currentCardIndex < day.exercises.length - 1) {
                currentCardIndex++;
                renderCard();
            } else {
                completedDays[selectedDayIndex] = true;
                localStorage.setItem('gym_completed_days', JSON.stringify(completedDays));
                showHome();
            }
        }

        function prevCard() {
            if (currentCardIndex > 0) {
                currentCardIndex--;
                renderCard();
            }
        }

        function startRestTimer() {
            const isLast = currentCardIndex === workoutDays[selectedDayIndex].exercises.length - 1;
            if (isLast) {
                nextCard();
                return;
            }

            const ex = workoutDays[selectedDayIndex].exercises[currentCardIndex];
            timeLeft = ex.restSeconds;
            document.getElementById('timer-target').textContent = `Target: ${ex.rest}`;
            document.getElementById('timer-overlay').classList.remove('hidden');
            
            timerRunning = true;
            updateTimerDisplay();

            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (timerRunning && timeLeft > 0) {
                    timeLeft--;
                    updateTimerDisplay();
                } else if (timeLeft === 0) {
                    skipTimer();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const mins = Math.floor(timeLeft / 60);
            const secs = timeLeft % 60;
            document.getElementById('timer-display').textContent = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        function toggleTimer() {
            timerRunning = !timerRunning;
            document.getElementById('btn-toggle-timer').textContent = timerRunning ? 'Pause' : 'Resume';
        }

        function addTime(secs) {
            timeLeft += secs;
            updateTimerDisplay();
        }

        function skipTimer() {
            clearInterval(timerInterval);
            document.getElementById('timer-overlay').classList.add('hidden');
            nextCard();
        }

        function resetData() {
            if (confirm("Reset all completion progress?")) {
                completedDays = {};
                localStorage.removeItem('gym_completed_days');
                renderHome();
            }
        }

        // Initial Load
        renderHome();
    </script>
</body>
</html>
