<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sleek Gym Log</title>
<script src="https://cdn.tailwindcss.com"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #F9F8F6; color: #22201E; }
.hide-scrollbar::-webkit-scrollbar { display: none; }
.hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
</style>
</head>
<body class="antialiased flex flex-col min-h-screen selection:bg-[#606C38] selection:text-white"
x-data="gymApp()">

<header class="px-6 pt-8 pb-4 flex justify-between items-center max-w-md mx-auto w-full">
<div>
<span class="text-xs font-semibold tracking-wider text-[#606C38] uppercase">Personal Log</span>
<h1 class="text-2xl font-bold tracking-tight">Daily Split</h1>
</div>
<button @click="resetData()" class="text-xs text-stone-400 hover:text-stone-700 underline">Reset Progress</button>
</header>

<main class="flex-1 px-6 max-w-md mx-auto w-full pb-12 relative">

<!-- HOME VIEW -->
<template x-if="currentView === 'home'">
<div class="space-y-4 mt-2">
<template x-for="(day, index) in workoutDays" :key="index">
<div @click="selectDay(index)"
class="p-5 rounded-2xl bg-white border border-stone-200 shadow-sm active:scale-95 transition-all cursor-pointer flex justify-between items-center">
<div>
<span class="text-xs font-medium text-stone-400" x-text="Day ${index + 1}"&gt;&lt;/span&gt; &lt;h2 class="text-lg font-bold text-[#22201E]" x-text="day.title"&gt;&lt;/h2&gt; &lt;p class="text-xs text-stone-500 mt-1" x-text="``${day.exercises.length} Exercises"></p>
</div>
<div class="w-8 h-8 rounded-full flex items-center justify-center"
:class="isDayCompleted(index) ? 'bg-[#606C38] text-white' : 'bg-stone-100 text-stone-600'">
<span x-text="isDayCompleted(index) ? '✓' : '→'" class="font-bold text-sm"></span>
</div>
</div>
</template>
</div>
</template>

<!-- FLASHCARDS VIEW -->
<template x-if="currentView === 'flashcards'">
<div class="flex flex-col h-full">
<div class="flex justify-between items-center mb-4">
<button @click="currentView = 'home'" class="text-sm font-semibold text-stone-600 flex items-center gap-1">
← Back to Split
</button>
<span class="text-xs font-bold px-2.5 py-1 rounded-full bg-stone-200 text-stone-700"
x-text="${currentCardIndex + 1} / ${currentDayData.exercises.length}"></span>
</div>

<div class="bg-white rounded-3xl border border-stone-200 shadow-sm overflow-hidden flex flex-col flex-1">
<div class="h-56 bg-stone-100 relative overflow-hidden">
<img :src="currentExercise.image" :alt="currentExercise.name" class="w-full h-full object-cover">
<div class="absolute top-3 left-3 bg-black/60 backdrop-blur-md text-white text-xs px-3 py-1 rounded-full font-medium"
x-text="currentExercise.target"></div>
</div>

<div class="p-6 flex flex-col justify-between flex-1">
<div>
<h2 class="text-xl font-bold text-[#22201E]" x-text="currentExercise.name"></h2>

<div class="grid grid-cols-3 gap-2 my-4">
<div class="bg-[#F9F8F6] p-2.5 rounded-xl text-center border border-stone-100">
<span class="block text-[10px] text-stone-400 uppercase font-semibold">Sets</span>
<span class="text-sm font-bold text-[#22201E]" x-text="currentExercise.sets"></span>
</div>
<div class="bg-[#F9F8F6] p-2.5 rounded-xl text-center border border-stone-100">
<span class="block text-[10px] text-stone-400 uppercase font-semibold">Reps</span>
<span class="text-sm font-bold text-[#22201E]" x-text="currentExercise.reps"></span>
</div>
<div class="bg-[#F9F8F6] p-2.5 rounded-xl text-center border border-stone-100">
<span class="block text-[10px] text-stone-400 uppercase font-semibold">Rest Target</span>
<span class="text-sm font-bold text-[#606C38]" x-text="currentExercise.rest"></span>
</div>
</div>

<div class="bg-stone-50 p-4 rounded-2xl border border-stone-100">
<span class="text-xs font-bold text-[#606C38] uppercase tracking-wider block mb-1">Form Pointers</span>
<p class="text-xs text-stone-600 leading-relaxed" x-text="currentExercise.formNote"></p>
</div>
</div>

<div class="flex gap-3 mt-6">
<button @click="prevCard()"
:disabled="currentCardIndex === 0"
class="flex-1 py-3.5 rounded-xl border border-stone-200 text-stone-700 font-semibold text-sm disabled:opacity-30">
Prev
</button>
<button @click="startRestTimer()"
class="flex-1 py-3.5 rounded-xl bg-[#22201E] text-white font-semibold text-sm shadow-sm active:scale-95 transition-all flex items-center justify-center gap-2">
<span>Rest & Next</span>
<span class="text-xs bg-stone-700 text-stone-200 px-2 py-0.5 rounded-md" x-text="⏱ ${currentExercise.rest}`"></span>
</button>
</div>
</div>
</div>
</div>
</template>

<!-- REST TIMER OVERLAY -->
<div x-show="timerActive"
x-transition:enter="transition ease-out duration-200"
x-transition:enter-start="opacity-0 scale-95"
x-transition:enter-end="opacity-100 scale-100"
x-transition:leave="transition ease-in duration-150"
x-transition:leave-start="opacity-100 scale-100"
x-transition:leave-end="opacity-0 scale-95"
class="fixed inset-0 bg-[#22201E]/90 backdrop-blur-md z-50 flex flex-col items-center justify-center p-6 text-white">

<span class="text-xs font-semibold tracking-widest text-[#606C38] uppercase mb-2">Rest Period</span>
<div class="text-6xl font-bold font-mono tracking-tight my-4" x-text="formattedTime"></div>
<p class="text-xs text-stone-400 mb-8 text-center" x-text="Target:${currentExercise.rest}`"></p>

<div class="flex items-center gap-4 w-full max-w-xs">
<button @click="addTime(30)" class="flex-1 py-3 rounded-xl bg-stone-800 text-stone-200 font-medium text-sm hover:bg-stone-700">
+30s
</button>
<button @click="toggleTimer()" class="flex-1 py-3 rounded-xl bg-[#606C38] text-white font-semibold text-sm">
<span x-text="timerRunning ? 'Pause' : 'Resume'"></span>
</button>
<button @click="skipTimer()" class="flex-1 py-3 rounded-xl bg-stone-800 text-stone-200 font-medium text-sm hover:bg-stone-700">
Skip
</button>
</div>
</div>

</main>

<script>
function gymApp() {
return {
currentView: 'home',
selectedDayIndex: 0,
currentCardIndex: 0,
completedDays: JSON.parse(localStorage.getItem('gym_completed_days')) || {},

// Timer State
timerActive: false,
timerRunning: false,
timeLeft: 0,
timerInterval: null,

workoutDays: [
{
title: "Day 1: Incline, Vertical Pull & Abs",
exercises: [
{
name: "Machine Incline Chest Press",
target: "Upper Chest",
sets: 3,
reps: "8–12",
rest: "2 min",
restSeconds: 120,
formNote: "Set seat height so handles align with upper chest/collarbone. Keep shoulders pinned back against the pad.",
image: "https://images.unsplash.com/photo-1571019613454-1cb2f99b2d8b?auto=format&fit=crop&w=600&q=80"
},
{
name: "Lat Pulldown Machine",
target: "Lats",
sets: 3,
reps: "8–12",
rest: "2 min",
restSeconds: 120,
formNote: "Lean back slightly, pull elbows down and back toward your hip pockets rather than pulling with your biceps.",
image: "https://images.unsplash.com/photo-1584735935682-2f2b69dff9d2?auto=format&fit=crop&w=600&q=80"
},
{
name: "Cable Upright Row",
target: "Lateral Delts",
sets: 3,
reps: "10–15",
rest: "90s",
restSeconds: 90,
formNote: "Use a rope or straight bar. Pull high and wide, leading with your elbows. Stop hands around chest level to save your rotator cuffs.",
image: "https://images.unsplash.com/photo-1534438327276-14e5300c3a48?auto=format&fit=crop&w=600&q=80"
},
{
name: "Leg Press Machine",
target: "Quads / Glutes",
sets: 3,
reps: "8–12",
rest: "2 min",
restSeconds: 120,
formNote: "Place feet shoulder-width flat on the platform. Don't lock your knees out completely at the top.",
image: "https://images.unsplash.com/photo-1517838277536-f5f99be501cd?auto=format&fit=crop&w=600&q=80"
},
{
name: "Cable Crunch (Rope)",
target: "Upper Abdominals",
sets: 3,
reps: "10–15",
rest: "90s",
restSeconds: 90,
formNote: "Kneel facing the stack, lock hips in place, and curl your ribcage down toward your pelvis using your abs, not your arms.",
image: "https://images.unsplash.com/photo-1571019614242-c5c5dee9f50b?auto=format&fit=crop&w=600&q=80"
}
 ]
},
{
title: "Day 2: Chest Isolation, Row & Lower Abs",
exercises: [
{
name: "Machine Chest Fly (Pec Deck)",
target: "Chest",
sets: 3,
reps: "10–15",
rest: "2 min",
restSeconds: 120,
formNote: "Keep a slight, permanent bend in your elbows. Squeeze your biceps together at the center like you're hugging a barrel.",
image: "https://images.unsplash.com/photo-1583454110551-21f2fa2afe61?auto=format&fit=crop&w=600&q=80"
},
{
name: "Machine Seated Row",
target: "Lats / Mid Back",
sets: 3,
reps: "8–12",
rest: "2 min",
restSeconds: 120,
formNote: "Keep chest firmly pressed against the chest pad. Pull straight back, squeezing your shoulder blades together at peak contraction.",
image: "https://images.unsplash.com/photo-1541534741688-6078c6bfb5c5?auto=format&fit=crop&w=600&q=80"
},
{
name: "Cable Upright Row",
target: "Lateral Delts",
sets: 3,
reps: "10–15",
rest: "90s",
restSeconds: 90,
formNote: "Control the eccentric (negative) phase on the way down. Don't swing your torso to bounce the weight up.",
image: "https://images.unsplash.com/photo-1534438327276-14e5300c3a48?auto=format&fit=crop&w=600&q=80"
},
{
name: "Leg Extension Machine",
target: "Quads",
sets: 3,
reps: "10–15",
rest: "90s",
restSeconds: 90,
formNote: "Align your knee joint with the machine's pivot axis. Pause for a full second at the top contraction.",
image: "https://images.unsplash.com/photo-1517838277536-f5f99be501cd?auto=format&fit=crop&w=600&q=80"
},
{
name: "Lying Floor Leg Raise",
target: "Lower Abdominals",
sets: 3,
reps: "10–15",
rest: "90s",
restSeconds: 90,
formNote: "Keep your lower back glued flat to the floor. If your lower back arches up, shorten your range of motion.",
image: "https://images.unsplash.com/photo-1566241142559-40e1dab266c6?auto=format&fit=crop&w=600&q=80"
}
 ]
},
{
title: "Day 3: Incline, Width & Obliques",
exercises: [
{
name: "Machine Incline Chest Press",
target: "Upper Chest",
sets: 3,
reps: "8–12",
rest: "2 min",
restSeconds: 120,
formNote: "Control the weight on the way down for a 2-second stretch before exploding upward.",
image: "https://images.unsplash.com/photo-1571019613454-1cb2f99b2d8b?auto=format&fit=crop&w=600&q=80"
},
{
name: "Lat Pulldown Machine",
target: "Lats",
sets: 3,
reps: "8–12",
rest: "2 min",
restSeconds: 120,
formNote: "Keep a proud chest throughout the movement. Don't let your shoulders roll forward at the top stretch.",
image: "https://images.unsplash.com/photo-1584735935682-2f2b69dff9d2?auto=format&fit=crop&w=600&q=80"
},
{
name: "Seated Leg Curl Machine",
target: "Hamstrings",
sets: 3,
reps: "10–15",
rest: "90s",
restSeconds: 90,
formNote: "Keep the pad securely locked against your lower calves just above your heels. Don't let your hips lift out of the seat.",
image: "https://images.unsplash.com/photo-1574680096145-d05b474e2155?auto=format&fit=crop&w=600&q=80"
},
{
name: "Machine Chest Fly (Pec Deck)",
target: "Chest",
sets: 3,
reps: "10–15",
rest: "2 min",
restSeconds: 120,
formNote: "Focus on a deep stretch in the chest at the back, but don't hyperextend your shoulders past comfort.",
image: "https://images.unsplash.com/photo-1583454110551-21f2fa2afe61?auto=format&fit=crop&w=600&q=80"
},
{
name: "Cable Woodchopper (Rope)",
target: "Obliques / Core",
sets: 3,
reps: "10–15",
rest: "90s",
restSeconds: 90,
formNote: "Rotate from your mid-spine and hips rather than yanking with your arms. Keep your core tight like bracing for a punch.",
image: "https://images.unsplash.com/photo-1518611012118-696072aa579a?auto=format&fit=crop&w=600&q=80"
}
 ]
}
],

get currentDayData() {
return this.workoutDays[this.selectedDayIndex];
},

get currentExercise() {
return this.currentDayData.exercises[this.currentCardIndex];
},

get formattedTime() {
const mins = Math.floor(this.timeLeft / 60);
const secs = this.timeLeft % 60;
return ${mins}:${secs &lt; 10 ? '0' : ''}${secs};
},

selectDay(index) {
this.selectedDayIndex = index;
this.currentCardIndex = 0;
this.currentView = 'flashcards';
},

startRestTimer() {
this.timeLeft = this.currentExercise.restSeconds || 90;
this.timerActive = true;
this.timerRunning = true;

clearInterval(this.timerInterval);
this.timerInterval = setInterval(() => {
if (this.timerRunning && this.timeLeft > 0) {
this.timeLeft--;
} else if (this.timeLeft === 0) {
this.finishRestTimer();
}
}, 1000);
},

toggleTimer() {
this.timerRunning = !this.timerRunning;
},

addTime(seconds) {
this.timeLeft += seconds;
},

skipTimer() {
this.finishRestTimer();
},

finishRestTimer() {
clearInterval(this.timerInterval);
this.timerActive = false;
this.timerRunning = false;
this.nextCard();
},

nextCard() {
if (this.currentCardIndex < this.currentDayData.exercises.length - 1) {
this.currentCardIndex++;
} else {
this.completedDays[this.selectedDayIndex] = true;
localStorage.setItem('gym_completed_days', JSON.stringify(this.completedDays));
this.currentView = 'home';
}
},

prevCard() {
if (this.currentCardIndex > 0) {
this.currentCardIndex--;
}
},

isDayCompleted(index) {
return !!this.completedDays[index];
},

resetData() {
if(confirm("Reset all completion progress?")) {
this.completedDays = {};
localStorage.removeItem('gym_completed_days');
}
}
}
}
</script>
</body>
</html>
